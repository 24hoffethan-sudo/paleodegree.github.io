<!-- Add this Login/Logout button inside your first .dw-block, right under the header -->
<div style="text-align: right; margin-bottom: 15px;">
    <button id="auth-btn" style="padding: 8px 16px; background-color: #003366; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Log in with Google to Save Progress</button>
</div>

<!-- Replace your existing <script> with this one -->
<script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
          apiKey: "AIzaSyASaD9pW1Hoxo31IZBqeUKbUyi5Yuoqg38",
          authDomain: "paleodegreetracker.firebaseapp.com",
          projectId: "paleodegreetracker",
          storageBucket: "paleodegreetracker.firebasestorage.app",
          messagingSenderId: "690291491470",
          appId: "1:690291491470:web:10b82aff94beac6a38ffdf",
          measurementId: "G-XQFHW1BS9L"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
    // DOM Elements
    const authBtn = document.getElementById('auth-btn');
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    let currentUser = null;

    // 4. Handle Login / Logout
    authBtn.addEventListener('click', () => {
        if (currentUser) {
            signOut(auth);
        } else {
            signInWithPopup(auth, provider).catch(error => alert("Login failed: " + error.message));
        }
    });

    // 5. Listen for Login State Changes
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            authBtn.innerText = `Log out (${user.email})`;
            await loadUserData(user.uid);
            enableCheckboxes(true);
        } else {
            currentUser = null;
            authBtn.innerText = "Log in with Google to Save Progress";
            resetCheckboxes();
            enableCheckboxes(false);
        }
    });

    // 6. Load User Data from Firestore
    async function loadUserData(userId) {
        const docRef = doc(db, "users", userId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            checkboxes.forEach(checkbox => {
                const courseId = checkbox.getAttribute('data-id');
                const row = checkbox.closest('tr');
                
                if (data[courseId] === true) {
                    checkbox.checked = true;
                    row.classList.add('completed-row');
                } else {
                    checkbox.checked = false;
                    row.classList.remove('completed-row');
                }
            });
        }
    }

    // 7. Save Checkbox Clicks to Firestore
    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', async (e) => {
            if (!currentUser) return; // Prevent saving if not logged in

            const courseId = checkbox.getAttribute('data-id');
            const isChecked = e.target.checked;
            const row = checkbox.closest('tr');

            // Update UI immediately
            if (isChecked) row.classList.add('completed-row');
            else row.classList.remove('completed-row');

            // Save to database
            const userRef = doc(db, "users", currentUser.uid);
            await setDoc(userRef, { [courseId]: isChecked }, { merge: true });
        });
    });

    // UI Helper Functions
    function resetCheckboxes() {
        checkboxes.forEach(checkbox => {
            checkbox.checked = false;
            checkbox.closest('tr').classList.remove('completed-row');
        });
    }

    function enableCheckboxes(enabled) {
        checkboxes.forEach(checkbox => {
            checkbox.disabled = !enabled;
        });
    }
</script>
